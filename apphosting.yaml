# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # To minimize costs, allow instances to scale down to 0 when there's no traffic.
  # For applications requiring faster cold starts, consider setting this to 1 or higher.
  minInstances: 0
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 3

# Environment variables available to the build and runtime environments.
# https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
#
# NEXT_PUBLIC_FIREBASE_* 값은 브라우저에 그대로 전달되는 Firebase 웹 설정값이라 원래 공개되는 값입니다.
# (예전에는 저장소에 올라가 있던 .env 파일에서 읽었습니다. .env는 이제 git에 올리지 않습니다.)
# apphosting.pcpsphysicsapp.yaml에도 같은 값이 있으며, 그 환경에서는 그 파일 값이 우선합니다.
#
# GEMINI_API_KEY와 TEACHER_PIN은 비밀값이라 여기에 값을 적지 않고 Secret Manager에서 가져옵니다.
# 배포 전에 한 번 만들어 두어야 합니다(없으면 새 배포가 실패하고, 기존 버전은 그대로 동작합니다):
#   firebase apphosting:secrets:set gemini-api-key --project physed-pal
#   firebase apphosting:secrets:set teacher-pin --project physed-pal
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDNvPRgDDnyBrkWURedb7zM8qcguJgA9c4"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "physed-pal.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "physed-pal"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "physed-pal.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "839550291355"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:839550291355:web:13022639a72f443a15253e"
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability:
      - RUNTIME
  - variable: TEACHER_PIN
    secret: teacher-pin
    availability:
      - RUNTIME
